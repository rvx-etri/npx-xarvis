[preprocess]
input=mnist_opendataset
timesteps=4
step_generation=direct

[train]
epoch=10
kfold=5
repeat=1

[global]
input_size=28,28
input_channels=1
output_classes=10
neuron_type=q8ssf

# 28x28x1 -> 28x28x16
[Conv2d]
in_channels=1
out_channels=16
kernel_size=3
stride=1
padding=1
#bias=False

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

##############################

# 28x28x16 -> 28x28x16
[Conv2d]
in_channels=16
out_channels=16
kernel_size=3
stride=1
padding=1
#bias=False

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# 28x28x16 -> 28x28x16
[Conv2d]
in_channels=16
out_channels=16
kernel_size=3
stride=1
padding=1
#bias=False

# 28x28x16 + 28x28x16 -> 28x28x16
[Shortcut]
skip_from=-5
type=Identity

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

##############################

# 28x28x16 -> 14x14x32
[Conv2d]
in_channels=16
out_channels=32
kernel_size=3
stride=2
padding=1
#bias=False

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# 14x14x32 -> 14x14x32
[Conv2d]
in_channels=32
out_channels=32
kernel_size=3
stride=1
padding=1
#bias=False

# (28x28x16 -> 14x14x32) + 14x14x32 -> 14x14x32
[Shortcut]
skip_from=-4
type=Conv2d
in_channels=16
out_channels=32
kernel_size=1
stride=2
padding=0
#groups=1

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

##########################

# 14x14x32 -> 6272
[Flatten]

[Linear]
in_features=6272
out_features=10

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

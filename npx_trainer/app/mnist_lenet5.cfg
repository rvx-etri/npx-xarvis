[preprocess]
input=mnist_opendataset
timesteps=4
step_generation=direct

[train]
epoch=10
kfold=5
repeat=1

[global]
input_size=28,28
input_channels=1
output_classes=10
neuron_type=q8ssf

# --------------------------------------------------
# Input: 1 x 28 x 28
# Conv1: 1 x 28 x 28 -> 6 x 24 x 24
# --------------------------------------------------
[Conv2d]
in_channels=1
out_channels=6
kernel_size=5
stride=1
padding=0
#bias=True

# 6 x 24 x 24 -> 6 x 12 x 12
[MaxPool2d]
kernel_size=2
stride=2
padding=0

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# --------------------------------------------------
# Conv2: 6 x 12 x 12 -> 16 x 8 x 8
# --------------------------------------------------
[Conv2d]
in_channels=6
out_channels=16
kernel_size=5
stride=1
padding=0
#bias=True

# 16 x 8 x 8 -> 16 x 4 x 4
[MaxPool2d]
kernel_size=2
stride=2
padding=0

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# --------------------------------------------------
# 16 x 4 x 4 -> 256
# --------------------------------------------------
[Flatten]

# --------------------------------------------------
# LeNet-5 fully connected layer 1
# 256 -> 120
# --------------------------------------------------
[Linear]
in_features=256
out_features=120

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# --------------------------------------------------
# LeNet-5 fully connected layer 2
# 120 -> 84
# --------------------------------------------------
[Linear]
in_features=120
out_features=84

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

# --------------------------------------------------
# Output layer
# 84 -> 10
# --------------------------------------------------
[Linear]
in_features=84
out_features=10

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

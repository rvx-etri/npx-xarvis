[preprocess]
input=mnist_opendataset
timesteps=4
step_generation=direct

[train]
epoch=10
kfold=5
repeat=1

[global]
input_size=28,28
input_channels=1
output_classes=10
neuron_type=ws8

########################################
# Stem
# 28x28x1 -> 28x28x16
########################################

[Conv2d]
in_channels=1
out_channels=16
kernel_size=3
stride=1
padding=1
#groups=1
#bias=True

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

########################################
# MobileNet Block 1
# Depthwise: 28x28x16 -> 28x28x16
# Pointwise: 28x28x16 -> 28x28x16
########################################

[Conv2d]
in_channels=16
out_channels=16
kernel_size=3
stride=1
padding=1
groups=16
#bias=True

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

[Conv2d]
in_channels=16
out_channels=16
kernel_size=1
stride=1
padding=0
groups=1
#bias=True

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

########################################
# MobileNet Block 2 - Downsample
# Depthwise: 28x28x16 -> 14x14x16
# Pointwise: 14x14x16 -> 14x14x32
########################################

[Conv2d]
in_channels=16
out_channels=16
kernel_size=3
stride=2
padding=1
groups=16
#bias=True

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

[Conv2d]
in_channels=16
out_channels=32
kernel_size=1
stride=1
padding=0
groups=1
#bias=True

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False

########################################
# Classifier
# 14x14x32 -> 6272 -> 10
########################################

[Flatten]

[Linear]
in_features=6272
out_features=10

[Leaky]
beta=1.0
#threshold=1.0
reset_mechanism=subtract
learn_threshold=False
